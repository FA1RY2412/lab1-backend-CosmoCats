openapi: 3.0.3
info:
  title: CosmoCats API
  version: "v1"
paths:
  /api/v1/products:
    get:
      summary: List products
      responses:
        "200": { description: OK }
    post:
      summary: Create product
      responses:
        "201": { description: Created }
  /api/v1/products/{id}:
    get:
      summary: Get product by id
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200": { description: OK }
        "404": { description: Not Found }
    put:
      summary: Update product by id
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200": { description: OK }
        "400": { description: Bad Request }
        "404": { description: Not Found }
    delete:
      summary: Delete product (idempotent)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: No Content }
