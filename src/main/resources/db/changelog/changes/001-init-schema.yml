databaseChangeLog:
  - changeSet:
      id: 001-init-schema
      author: student

      changes:
        - createSequence:
            sequenceName: category_seq
        - createSequence:
            sequenceName: product_seq
        - createSequence:
            sequenceName: order_seq

        - createTable:
            tableName: categories
            columns:
            - column:
                name: id
                type: BIGSERIAL
                constraints:
                    primaryKey: true
                    nullable: false
            - column:
                name: code
                type: VARCHAR(64)
                constraints:
                    nullable: false
            - column:
                name: title
                type: VARCHAR(255)
                constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: categories
            columnNames: code
            constraintName: uk_categories_code


        - createTable:
            tableName: products
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(2000)
              - column:
                  name: price
                  type: DOUBLE PRECISION
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: products
            baseColumnNames: category_id
            constraintName: fk_products_category
            referencedTableName: categories
            referencedColumnNames: id

        - addUniqueConstraint:
            tableName: products
            columnNames: category_id, name
            constraintName: uk_products_category_name

        - createIndex:
            tableName: products
            indexName: idx_products_name
            columns:
              - column:
                  name: name

        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: number
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: customer_name
                  type: VARCHAR(128)
              - column:
                  name: status
                  type: VARCHAR(32)
              - column:
                  name: created_at
                  type: TIMESTAMP

        - addUniqueConstraint:
            tableName: orders
            columnNames: number
            constraintName: uk_orders_number

        - createTable:
            tableName: order_products
            columns:
              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: order_products
            columnNames: order_id, product_id
            constraintName: pk_order_products

        - addForeignKeyConstraint:
            baseTableName: order_products
            baseColumnNames: order_id
            constraintName: fk_order_products_order
            referencedTableName: orders
            referencedColumnNames: id

        - addForeignKeyConstraint:
            baseTableName: order_products
            baseColumnNames: product_id
            constraintName: fk_order_products_product
            referencedTableName: products
            referencedColumnNames: id
